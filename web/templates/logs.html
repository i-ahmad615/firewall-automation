{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block heading %}Application Logs{% endblock %}

{% block content %}
<section class="card panel">
  <div class="panel-header">
    <h2>Structured Log Stream</h2>
    <div class="flex gap-2">
      <a class="btn" href="/api/export/logs.csv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 21h16" stroke-linecap="round"/></svg>CSV</a>
      <a class="btn" href="/api/export/logs.xlsx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 21h16" stroke-linecap="round"/></svg>Excel</a>
      <button class="btn btn-danger" id="clear-all" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6" stroke-linecap="round" stroke-linejoin="round"/></svg>Clear All</button>
    </div>
  </div>

  <div class="table-toolbar mt-2" style="margin-bottom: var(--space-4)">
    <input class="input input-search" id="f-search" placeholder="Search log messages…">
    <select class="select" id="f-severity">
      <option value="">All severities</option>
      <option value="INFO">Info</option>
      <option value="SUCCESS">Success</option>
      <option value="WARNING">Warning</option>
      <option value="ERROR">Error</option>
      <option value="CRITICAL">Critical</option>
    </select>
    <select class="select" id="f-category">
      <option value="">All categories</option>
    </select>
    <input class="input" type="date" id="f-from" title="From date">
    <input class="input" type="date" id="f-to" title="To date">
    <label class="field-check text-sm"><input type="checkbox" id="f-auto" checked> Auto-refresh</label>
  </div>

  <div class="table-wrap">
    <table class="data-table" id="table">
      <thead>
        <tr>
          <th>Time</th>
          <th>Level</th>
          <th>Category</th>
          <th>Message</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div class="pagination">
    <span id="page-info"></span>
    <div class="pagination-btns">
      <button class="btn" id="prev-page">Previous</button>
      <button class="btn" id="next-page">Next</button>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/js/logs.js?v=20260728-1"></script>
{% endblock %}
